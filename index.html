<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Encuesta MRT">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-192.png">
<title>Encuesta MRT</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: una pregunta por pantalla, con botones grandes para usarse de pie y con guantes. */
:root {
  --bg: #eef0f4; --panel: #ffffff; --fg: #14202e; --muted: #526070; --line: #bfc7d2;
  --accent: #1f3a5f; --primary: #d9ae2c; --primary-fg: #131418; --band: #131418; --band-fg: #f4f2ec; --band-sub: #c9ced6; --gold: #c9a227;
  --chosen: #e7edf6; --ok: #1f6b45; --warn: #8a3b12; --warn-bg: #fde8d8;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif; --body: Barlow, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1216; --panel: #1b2029; --fg: #f1f2f4; --muted: #a9b1bc; --line: #3b4452;
  --accent: #e0b93f; --chosen: #33301f; --ok: #6fd09f; --warn: #ffc29c; --warn-bg: #43261a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #1b2029; --fg: #f1f2f4; --muted: #a9b1bc; --line: #3b4452;
  --accent: #e0b93f; --chosen: #33301f; --ok: #6fd09f; --warn: #ffc29c; --warn-bg: #43261a; color-scheme: dark }
* { box-sizing: border-box }
html, body { min-height: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font: 500 17px/1.35 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 28px }
main { max-width: 720px; margin: 0 auto; display: grid; gap: 16px }
h1, h2 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.08 }
h1 { font-size: 2.5rem } h2 { font-size: 2rem }
p { margin: 0 } .muted { color: var(--muted) } .small { font-size: .9rem }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px }
.link { background: none; border: 0; padding: 10px 4px; font-weight: 600; color: var(--muted) }
.step { font-family: var(--display); font-size: 1.15rem; font-variant-numeric: tabular-nums; color: var(--muted) }
.bar { height: 7px; background: var(--line); border-radius: 4px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--gold); transition: width .15s }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 10px }
.tile { min-height: 64px; width: 100%; padding: 12px 16px; text-align: left; font-size: 1.15rem; font-weight: 600;
  background: var(--panel); border: 2px solid var(--line); border-radius: 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px }
.tile small { display: block; font-size: .9rem; font-weight: 500; color: var(--muted) }
.tile:active { border-color: var(--accent) }
.tile[aria-pressed="true"] { background: var(--chosen); border-color: var(--accent) }
.tile .check { font-family: var(--display); font-size: 1.4rem; color: var(--accent); flex: none; min-width: 1em; text-align: right }
.scale { grid-template-columns: 1fr }
.scale .num { font: 700 2.1rem/1 var(--display); color: var(--accent); flex: none; width: 1.2em }
.scale .tile { justify-content: flex-start }
.primary { min-height: 60px; width: 100%; background: var(--primary); color: var(--primary-fg); border: 0; border-radius: 8px; font-weight: 700; font-size: 1.2rem; padding: 10px 16px }
.primary:disabled { opacity: .45; cursor: not-allowed }
.second { min-height: 54px; width: 100%; background: var(--panel); border: 2px solid var(--line); border-radius: 8px; font-weight: 600; padding: 10px 16px }
.danger { color: var(--warn); border-color: var(--warn) }
input[type=text], input[type=tel], input[type=password] { width: 100%; min-height: 56px; padding: 10px 14px; font: inherit; color: var(--fg); background: var(--panel); border: 2px solid var(--line); border-radius: 8px }
.stepper { display: grid; grid-template-columns: 72px 1fr 72px; gap: 10px; align-items: stretch }
.stepper button { min-height: 76px; font: 700 2.3rem/1 var(--display); background: var(--panel); border: 2px solid var(--line); border-radius: 8px }
.stepper output { display: grid; place-items: center; font: 700 3.3rem/1 var(--display); font-variant-numeric: tabular-nums }
.quick { display: flex; flex-wrap: wrap; gap: 8px }
.quick button { flex: 1 1 56px; min-height: 52px; background: var(--panel); border: 2px solid var(--line); border-radius: 8px; font-weight: 600; font-variant-numeric: tabular-nums }
.notice { background: var(--warn-bg); color: var(--warn); padding: 12px 14px; border-radius: 8px; font-weight: 600 }
.ok { color: var(--ok) }
.sticky { position: sticky; bottom: 12px }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; background: var(--panel) }
th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: right } th:first-child, td:first-child { text-align: left }
th { font-size: .85rem; color: var(--muted) }
.wide { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 10px }
textarea { width: 100%; height: 110px; font: .8rem monospace; color: var(--fg); background: var(--panel); border: 1px solid var(--line) }
.marca { background: var(--band); color: var(--band-fg); border-bottom: 4px solid var(--gold); border-radius: 8px 8px 0 0; padding: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px }
.marca img { display: block; flex: none; width: 118px; height: auto }
.marca > div { flex: 1 1 170px; min-width: 0 }
.marca h1 { font-size: 1.85rem }
.marca p { color: var(--band-sub); font-size: .9rem; margin-top: 4px }
.linea-meta { font-weight: 600 }
.unidad { font-family: var(--display); font-size: 1.35rem; margin: 6px 0 0 }
td.falta { font-weight: 700; color: var(--accent) }
td.ok { font-weight: 700 }
.guardadas { background: var(--panel); border: 2px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px }
.cifra { display: flex; align-items: center; gap: 12px; font-weight: 600 }
.numero { font: 700 3rem/1 var(--display); color: var(--accent); font-variant-numeric: tabular-nums }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none } }
</style>
</head>

    ir.textContent = n ? "Continuar (" + elegidos.length + " de 3)" : "Ninguno, continuar";
  }
  botones = p.o().map(function (o) {

function escala(p) {

  }));
}
function numero(p) {
  var v = r[p.k] || 1, salida = el("output", { text: String(v) });
  function fija(x) { v = Math.min(2000, Math.max(1, x)); salida.textContent = String(v); }

    el("div", { "class": "stepper" }, [ el("button", { "aria-label": "Una menos", text: "−", on: function () { fija(v - 1); } }), salida, el("button", { "aria-label": "Una más", text: "+", on: function () { fija(v + 1); } }) ]),
    el("div", { "class": "quick" }, [1, 2, 3, 5, 10, 20, 50].map(function (x) { return el("button", { text: String(x), on: function () { fija(x); } }); })),
    el("button", { "class": "primary", text: "Continuar", on: function () { r[p.k] = v; avanzar(); } })

}
function panelGuardadas(mensaje) {
  mensaje = mensaje || ultimoMensaje; ultimoMensaje = null;
  var n = db.pendientes.length;
  var trabajadores = db.pendientes.filter(function (p) { return p.tipo === "T"; }).length;
  var caja = el("section", { "class": "guardadas", id: "guardadas" }, [
    el("div", { "class": "cifra" }, [
      el("span", { "class": "numero", id: "conteo", text: String(n) }),
      el("span", { text: n === 1 ? "encuesta guardada en este teléfono" : "encuestas guardadas en este teléfono" })

    n ? el("p", { "class": "small muted", text: "Trabajadores: " + trabajadores + " · Temas de jefes: " + (n - trabajadores) }) : null,

      else { ultimoMensaje = null; caja.replaceWith(panelGuardadas(resultado)); }
    }
    if (!antes) {
      actualizarAvance(function (ok) {
        termina(ok ? { ok: true, texto: "Avance actualizado." } : { ok: false, texto: "Sin señal. El avance es el último que se descargó." });
      });
      return;
    }

      var hechas = antes - db.pendientes.length, faltan = db.pendientes.length;
      if (ok) termina({ ok: true, texto: "Listo. Se " + (hechas === 1 ? "subió 1 encuesta." : "subieron " + hechas + " encuestas.") });
      else if (hechas) termina({ ok: false, texto: "Se subieron " + hechas + " y faltan " + faltan + ". Toca Actualizar con mejor señal." });

}
function enviarPendientes(alTerminar) {
  alTerminar = alTerminar || function () {};

  var control = new AbortController(), limite = setTimeout(function () { control.abort(); }, 30000);
  fetch(URL_ENVIO, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(lote), redirect: "follow", signal: control.signal })
    .then(function (resp) { if (!resp.ok) throw new Error("Sin respuesta"); return resp.json(); })
    .then(function (res) {
      clearTimeout(limite);
      enviando = false;
      var listos = (res && res.folios) || [];
      if (!listos.length) { alTerminar(false); return; }
      var antes = db.pendientes.length;
      db.pendientes = db.pendientes.filter(function (p) { return listos.indexOf(p.fila[0]) < 0; });
      db.subidas += antes - db.pendientes.length;
      if (res.avance && res.avance.filas) db.avance = res.avance;
      guardar();

    })
    .catch(function () { clearTimeout(limite); enviando = false; alTerminar(false); });
}
function terminar() {
  if (modo === "T") {
    var t = r.temas || [];
    db.pendientes.push({ tipo: "T", fila: [folio("T"), r.unidad, r.area, r.puesto, r.turno, t[0] || "", t[1] || "", t[2] || "", r.otro || "", r.dominar, r.dificil, r.crecer, r.aprende, r.horario, r.nombre || "", r.telefono || ""] });
    guardar();
    pintar([ aviso(), el("h1", { "class": "ok", text: "Listo, guardada en tu teléfono" }), lineaMeta(r.unidad, r.area), panelGuardadas(),
      el("button", { "class": "second", text: "Responder otra encuesta", on: function () { iniciar("T"); } }), el("button", { "class": "second", text: "Terminar", on: inicio }) ]);
    return;
  }
  db.pendientes.push({ tipo: "J", fila: [folio("A"), r.unidad, r.area, r.puesto, r.tema, Number(r.req), Number(r.act), Number(r.personas), r.problema, r.prioridad, r.medir, r.nombre || "", r.telefono || ""] });
  guardar();
  var hechos = r.puesto;
  function otraVez(saltar) {
    var base = { nombre: r.nombre, telefono: r.telefono, unidad: r.unidad };
    if (saltar) { base.area = r.area; base.puesto = r.puesto; }
    r = base;
    flujo = saltar ? P_CICLO : P_PUESTO_J.concat(P_CICLO); i = -1; avanzar();
  }
  pintar([ aviso(), el("h1", { "class": "ok", text: "Listo, tema guardado en tu teléfono" }), el("p", { "class": "muted", text: hechos + " · " + r.tema }), panelGuardadas(),
    el("button", { "class": "primary", text: "Otro tema para este puesto", on: function () { otraVez(true); } }),
    el("button", { "class": "second", text: "Otro puesto", on: function () { otraVez(false); } }),
    el("button", { "class": "second", text: "Terminar", on: inicio }) ]);
}
function inicio() {
  var kids = [
    aviso(),
    el("header", { "class": "marca" }, [
      LOGO ? el("img", { src: LOGO, alt: "Logo de Minera Río Tinto", id: "logo-mrt" }) : null,
      el("div", {}, [ el("h1", { text: "Encuesta de capacitación" }), el("p", { text: "Minera Río Tinto S.A. de C.V." }) ])
    ]),
    el("p", { "class": "muted", text: "Temas técnicos, administrativos y de liderazgo" }),
    el("div", { "class": "tiles" }, [
      el("button", { "class": "tile", id: "ir-trabajador", on: function () { iniciar("T"); } }, [ el("span", {}, [ document.createTextNode("Trabajador"), el("small", { text: "Hasta 12 preguntas" }) ]) ]),
      el("button", { "class": "tile", id: "ir-jefe", on: function () { iniciar("J"); } }, [ el("span", {}, [ document.createTextNode("Jefe o supervisor"), el("small", { text: "Tus datos y 9 preguntas por tema" }) ]) ])
    ])
  ];
  var total = resumenMetas();
  kids.push(el("button", { "class": "tile", id: "ir-metas", on: pantallaMetas }, [ el("span", {}, [
    document.createTextNode("Metas de la muestra"),
    el("small", { id: "resumen-metas", text: total.faltan ? "Faltan " + total.faltan + " de " + total.meta + " encuestas" : "Meta completa: " + total.meta + " encuestas" })
  ]) ]));
  if (db.pendientes.length || db.subidas || ultimoMensaje) kids.push(panelGuardadas());
  if (!instalada()) kids.push(bloqueInstalar());
  pintar(kids);
}
function filasMeta() {
  var base = (db.avance && db.avance.filas) || METAS;
  return base.map(function (f) {
    var aqui = db.pendientes.filter(function (p) { return p.tipo === "T" && p.fila[1] === f[0] && p.fila[2] === f[1]; }).length;
    var llevan = (Number(f[4]) || 0) + aqui;
    return { unidad: f[0], area: f[1], poblacion: Number(f[2]) || 0, meta: Number(f[3]) || 0, llevan: llevan, aqui: aqui, faltan: Math.max((Number(f[3]) || 0) - llevan, 0) };
  });
}
function resumenMetas() {
  return filasMeta().reduce(function (s, f) { s.meta += f.meta; s.llevan += f.llevan; s.faltan += f.faltan; return s; }, { meta: 0, llevan: 0, faltan: 0 });
}
function lineaMeta(unidad, area) {
  var f = filasMeta().filter(function (x) { return x.unidad === unidad && x.area === area; })[0];
  var texto = !f ? unidad + " · " + area + ": sin meta asignada"
    : f.faltan ? unidad + " · " + area + ": faltan " + f.faltan + " de " + f.meta
    : unidad + " · " + area + ": meta completa (" + f.meta + ")";

function pantallaMetas() {

    el("div", { "class": "top", id: "pantalla-metas" }, [ el("button", { "class": "link", text: "← Inicio", on: inicio }) ]),
    el("h2", { text: "Metas de la muestra" }),
    el("div", { "class": "cifra" }, [ el("span", { "class": "numero", id: "faltan-total", text: String(total.faltan) }), el("span", { text: "encuestas de trabajadores por conseguir, de " + total.meta }) ]),
    el("p", { "class": "small muted", text: fecha ? "Avance de todos los teléfonos al " + fecha.toLocaleString("es-MX") + ", más lo guardado en este." : "Sin descargar todavía. Solo se cuenta lo guardado en este teléfono; toca Actualizar con señal." }),

        return el("tr", {}, [ el("td", { text: f.area }), el("td", { text: String(f.meta) }), el("td", { text: String(f.llevan) }),
          el("td", { "class": f.faltan ? "falta" : "ok", text: f.faltan ? String(f.faltan) : "✓" }) ]);
      }))
    ]) ]));
  });
  kids.push(el("p", { "class": "small muted", text: "Solo cuenta trabajadores. Las metas se pueden cambiar en la pestaña Metas de la hoja de Google." }));
  pintar(kids);
}
function actualizarAvance(alTerminar) {
  if (navigator.onLine === false) { alTerminar(false); return; }
  var control = new AbortController(), limite = setTimeout(function () { control.abort(); }, 30000);
  fetch(URL_ENVIO + "?accion=avance", { redirect: "follow", signal: control.signal })
    .then(function (resp) { if (!resp.ok) throw new Error("Sin respuesta"); return resp.json(); })
    .then(function (res) {
      clearTimeout(limite);
      if (!res || !res.filas) { alTerminar(false); return; }

    })
    .catch(function () { clearTimeout(limite); alTerminar(false); });
}
function enInicio() { return !!document.getElementById("ir-trabajador"); }

/* Instalación en la pantalla de inicio. */
var avisoInstalar = null;
function instalada() { return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true; }

  if (avisoInstalar) {

window.addEventListener("beforeinstallprompt", function (e) {

try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
function pintar(kids) {

inicio();
